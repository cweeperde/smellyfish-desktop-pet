name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Check version
        shell: bash
        run: |
          v=$(python -c "import smellyfish; print(smellyfish.__version__)")
          tag="${GITHUB_REF_NAME%%-*}"
          test "v$v" = "$tag" || { echo "Tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; }

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: |
          pip install ruff==0.14.4
          ruff check .
          ruff format --check .

      - name: Check sources
        run: python tools/smoke_test.py

      - name: Build
        run: python tools/build_exe.py

      - name: Check the packaged app
        run: python tools/smoke_test.py --exe dist/Smellyfish.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: windows
          path: dist/Smellyfish.exe
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PYTHON_PKG: python-3.13.17-macos11.pkg
      PYTHON_SHA256: 3053592af66128269efab37fe7851a4894920b27c442aeec99ce4d34d17c07e3
      SMELLYFISH_MAC_ARCH: universal2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # python.org's installer is a universal2 build, which a universal2 app needs
      - name: Install Python (universal2)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/python.pkg" "https://www.python.org/ftp/python/3.13.17/$PYTHON_PKG"
          echo "$PYTHON_SHA256  $RUNNER_TEMP/python.pkg" | shasum -a 256 -c -
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          /Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Check version
        run: |
          v=$(python -c "import smellyfish; print(smellyfish.__version__)")
          tag="${GITHUB_REF_NAME%%-*}"
          test "v$v" = "$tag" || { echo "Tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; }

      # Pillow, psutil and numpy only publish separate arm64 and x86_64 wheels: merge each pair into universal2
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install delocate==0.13.0
          mkdir -p wheels/arm64 wheels/x86_64 wheels/universal2
          for pkg in $(grep -E '^(Pillow|psutil|numpy)==' requirements.txt); do
            pip download --only-binary=:all: --no-deps --python-version 3.13 --platform macosx_11_0_arm64 -d wheels/arm64 "$pkg"
            pip download --only-binary=:all: --no-deps --python-version 3.13 --platform macosx_11_0_x86_64 -d wheels/x86_64 "$pkg"
          done
          for arm in wheels/arm64/*.whl; do
            name=$(basename "$arm" | cut -d- -f1)
            delocate-merge "$arm" wheels/x86_64/${name}-*.whl -w wheels/universal2
          done
          pip install wheels/universal2/*.whl
          pip install -r requirements.txt

      - name: Check sources
        run: python tools/smoke_test.py

      - name: Build
        run: python tools/build_exe.py

      - name: Check both architectures are in the app
        run: |
          for f in dist/Smellyfish.app/Contents/MacOS/Smellyfish; do
            lipo -archs "$f" | grep -q x86_64
            lipo -archs "$f" | grep -q arm64
          done

      - name: Check the packaged app (Apple silicon)
        run: python tools/smoke_test.py --exe dist/Smellyfish.app

      - name: Check the packaged app (Intel, through Rosetta)
        run: |
          /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
          python tools/smoke_test.py --exe dist/Smellyfish.app --arch x86_64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: macos
          path: dist/Smellyfish.dmg
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Attest the build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/Smellyfish.exe
            dist/Smellyfish.dmg

      - name: Release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          python3 tools/release_notes.py "${v%%-*}" > notes.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            dist/Smellyfish.exe
            dist/Smellyfish.dmg
          body_path: notes.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
